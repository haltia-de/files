# Every photo, video and sound file on the tablet in one place.
# Installed as /usr/local/share/b8k/apps.d/gallery.conf; b8k-apps adds it to
# the shell's programs (fields: see /usr/local/share/b8k/apps.conf).
[gallery]
label = Галерея
icon = /usr/local/share/b8k/gallery.svg
app_ids = b8k-gallery b8k.Gallery
exec = b8k-files --gallery
